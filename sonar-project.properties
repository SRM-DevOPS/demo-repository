# Must be unique for your SonarQube/SonarCloud instance
sonar.projectKey=fastapi-template-demo
sonar.projectName=FastAPI Template Demo
sonar.projectVersion=1.0

# Path to source directories
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/venv/**,**/.venv/**,**/alembic/**,**/client/**

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Language-specific configurations
sonar.python.version=3.10
sonar.javascript.environments=browser,node
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# Coverage reports (optional, but recommended)
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
