name: Frontend CI → ECR → ECS (Integration → UAT → Prod)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ecr.yml'

jobs:
  code-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Trivy FS scan
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: |
          trivy fs --scanners vuln,secret,config --ignore-unfixed --severity CRITICAL --exit-code 1 --skip-dirs .git,.venv,backend/.venv,frontend/node_modules .

  build-scan-push:
    runs-on: ubuntu-latest
    needs: code-scan
    outputs:
      version: ${{ steps.meta.outputs.version }}
      repo_name: ${{ steps.meta.outputs.repo_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      - name: Set version and image uri
        id: meta
        run: |
          VERSION=${GITHUB_SHA::7}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Use shell variables for fallback instead of invalid GH expression syntax
          REPO_NAME="${{ secrets.FRONTEND_ECR_REPO }}"
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="${{ secrets.ECR_REPO }}"
          fi
          
          if [ -z "$REPO_NAME" ]; then
            echo "::error::Neither FRONTEND_ECR_REPO nor ECR_REPO secrets are set."
            exit 1
          fi
          
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$REPO_NAME"
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
      - name: Build image
        run: docker build -f frontend/Dockerfile -t frontend:${{ steps.meta.outputs.version }} .
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Trivy Image scan
        run: trivy image --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 frontend:${{ steps.meta.outputs.version }}
      - name: Tag and push
        run: |
          IMAGE_URI=${{ steps.meta.outputs.image_uri }}
          VERSION=${{ steps.meta.outputs.version }}
          docker tag frontend:$VERSION $IMAGE_URI:frontend-$VERSION
          docker push $IMAGE_URI:frontend-$VERSION

  deploy-integration:
    runs-on: ubuntu-latest
    needs: build-scan-push
    environment: integration
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Validate environment secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.ECS_CLUSTER }}" ] && MISSING+=("ECS_CLUSTER")
          [ -z "${{ secrets.FRONTEND_ECS_SERVICE }}" ] && MISSING+=("FRONTEND_ECS_SERVICE")
          [ -z "${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}" ] && MISSING+=("FRONTEND_ECS_TASK_DEFINITION")
          [ -z "${{ secrets.FRONTEND_CONTAINER_NAME }}" ] && MISSING+=("FRONTEND_CONTAINER_NAME")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error title=Missing environment secrets::Missing in 'integration' environment: ${MISSING[*]}"
            exit 1
          fi
      - name: Verify task definition exists
        run: |
          set +e
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Invalid FRONTEND_ECS_TASK_DEFINITION::Cannot describe task definition '${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}'. Ensure it is a task definition family name or full ARN in the same AWS account/region, and that the IAM user has ecs:DescribeTaskDefinition."
            echo "Recent task definitions in this region/account:"
            aws ecs list-task-definitions --sort DESC --max-items 20 --output text || true
            exit 1
          fi
      - name: Fetch task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}" \
            --query taskDefinition > task.json
      - name: Update task image
        run: |
          REPO_NAME=${{ needs.build-scan-push.outputs.repo_name }}
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$REPO_NAME"
          VERSION=${{ needs.build-scan-push.outputs.version }}
          jq --arg IMG "$IMAGE_URI:frontend-$VERSION" --arg NAME "${{ secrets.FRONTEND_CONTAINER_NAME }}" '
            .containerDefinitions |= map(
              if .name == $NAME then .image = $IMG else . end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task.json > new-task.json
      - name: Register task
        id: register-task
        run: |
          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition_arn=$NEW_TASK_ARN" >> $GITHUB_OUTPUT
      - name: Update service
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.FRONTEND_ECS_SERVICE }}" \
            --task-definition "${{ steps.register-task.outputs.task_definition_arn }}" \
            --force-new-deployment

  deploy-uat:
    runs-on: ubuntu-latest
    needs: deploy-integration
    environment: uat
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Validate environment secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.ECS_CLUSTER }}" ] && MISSING+=("ECS_CLUSTER")
          [ -z "${{ secrets.FRONTEND_ECS_SERVICE }}" ] && MISSING+=("FRONTEND_ECS_SERVICE")
          [ -z "${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}" ] && MISSING+=("FRONTEND_ECS_TASK_DEFINITION")
          [ -z "${{ secrets.FRONTEND_CONTAINER_NAME }}" ] && MISSING+=("FRONTEND_CONTAINER_NAME")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error title=Missing environment secrets::Missing in 'uat' environment: ${MISSING[*]}"
            exit 1
          fi
      - name: Verify task definition exists
        run: |
          set +e
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Invalid FRONTEND_ECS_TASK_DEFINITION::Cannot describe task definition '${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}'. Ensure it is a task definition family name or full ARN in the same AWS account/region, and that the IAM user has ecs:DescribeTaskDefinition."
            echo "Recent task definitions in this region/account:"
            aws ecs list-task-definitions --sort DESC --max-items 20 --output text || true
            exit 1
          fi
      - name: Fetch task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}" \
            --query taskDefinition > task.json
      - name: Update task image
        run: |
          IMAGE_URI=${{ needs.build-scan-push.outputs.image_uri }}
          VERSION=${{ needs.build-scan-push.outputs.version }}
          jq --arg IMG "$IMAGE_URI:frontend-$VERSION" --arg NAME "${{ secrets.FRONTEND_CONTAINER_NAME }}" '
            .containerDefinitions |= map(
              if .name == $NAME then .image = $IMG else . end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task.json > new-task.json
      - name: Register task
        id: register-task
        run: |
          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition_arn=$NEW_TASK_ARN" >> $GITHUB_OUTPUT
      - name: Update service
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.FRONTEND_ECS_SERVICE }}" \
            --task-definition "${{ steps.register-task.outputs.task_definition_arn }}" \
            --force-new-deployment

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-uat
    environment: production
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Validate environment secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.ECS_CLUSTER }}" ] && MISSING+=("ECS_CLUSTER")
          [ -z "${{ secrets.FRONTEND_ECS_SERVICE }}" ] && MISSING+=("FRONTEND_ECS_SERVICE")
          [ -z "${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}" ] && MISSING+=("FRONTEND_ECS_TASK_DEFINITION")
          [ -z "${{ secrets.FRONTEND_CONTAINER_NAME }}" ] && MISSING+=("FRONTEND_CONTAINER_NAME")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error title=Missing environment secrets::Missing in 'production' environment: ${MISSING[*]}"
            exit 1
          fi
      - name: Verify task definition exists
        run: |
          set +e
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Invalid FRONTEND_ECS_TASK_DEFINITION::Cannot describe task definition '${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}'. Ensure it is a task definition family name or full ARN in the same AWS account/region, and that the IAM user has ecs:DescribeTaskDefinition."
            echo "Recent task definitions in this region/account:"
            aws ecs list-task-definitions --sort DESC --max-items 20 --output text || true
            exit 1
          fi
      - name: Fetch task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.FRONTEND_ECS_TASK_DEFINITION }}" \
            --query taskDefinition > task.json
      - name: Update task image
        run: |
          IMAGE_URI=${{ needs.build-scan-push.outputs.image_uri }}
          VERSION=${{ needs.build-scan-push.outputs.version }}
          jq --arg IMG "$IMAGE_URI:frontend-$VERSION" --arg NAME "${{ secrets.FRONTEND_CONTAINER_NAME }}" '
            .containerDefinitions |= map(
              if .name == $NAME then .image = $IMG else . end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
