name: Frontend - Build, Scan, Push & Deploy (Single ECR Repo)

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ecr.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/uat" ]]; then
            echo "ENV=uat" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/integration" ]]; then
            echo "ENV=int" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      - name: Load Env Config
        run: |
          if [[ "$ENV" == "prod" ]]; then
            CL='${{ secrets.ECS_CLUSTER_PROD }}'
            SRV='${{ secrets.ECS_SERVICE_FRONTEND_PROD }}'
            TD1='${{ secrets.ECS_TASK_DEF_FRONTEND_PROD }}'
            TD2='${{ secrets.ECS_TASK_DEFINITION_FRONTEND_PROD }}'
            TD3='${{ secrets.ECS_TASK_DEFINITION }}'
            echo "ECS_CLUSTER=${CL}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${SRV}" >> $GITHUB_ENV
            [[ -n "$TD1" ]] && echo "TASK_DEF=$TD1" >> $GITHUB_ENV || \
            [[ -n "$TD2" ]] && echo "TASK_DEF=$TD2" >> $GITHUB_ENV || \
            echo "TASK_DEF=$TD3" >> $GITHUB_ENV
          elif [[ "$ENV" == "uat" ]]; then
            CL='${{ secrets.ECS_CLUSTER_UAT }}'
            SRV='${{ secrets.ECS_SERVICE_FRONTEND_UAT }}'
            TD1='${{ secrets.ECS_TASK_DEF_FRONTEND_UAT }}'
            TD2='${{ secrets.ECS_TASK_DEFINITION_FRONTEND_UAT }}'
            TD3='${{ secrets.ECS_TASK_DEFINITION }}'
            echo "ECS_CLUSTER=${CL}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${SRV}" >> $GITHUB_ENV
            [[ -n "$TD1" ]] && echo "TASK_DEF=$TD1" >> $GITHUB_ENV || \
            [[ -n "$TD2" ]] && echo "TASK_DEF=$TD2" >> $GITHUB_ENV || \
            echo "TASK_DEF=$TD3" >> $GITHUB_ENV
          elif [[ "$ENV" == "int" ]]; then
            CL='${{ secrets.ECS_CLUSTER_INT }}'
            SRV='${{ secrets.ECS_SERVICE_FRONTEND_INT }}'
            TD1='${{ secrets.ECS_TASK_DEF_FRONTEND_INT }}'
            TD2='${{ secrets.ECS_TASK_DEFINITION_FRONTEND_INT }}'
            TD3='${{ secrets.ECS_TASK_DEFINITION }}'
            echo "ECS_CLUSTER=${CL}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${SRV}" >> $GITHUB_ENV
            [[ -n "$TD1" ]] && echo "TASK_DEF=$TD1" >> $GITHUB_ENV || \
            [[ -n "$TD2" ]] && echo "TASK_DEF=$TD2" >> $GITHUB_ENV || \
            echo "TASK_DEF=$TD3" >> $GITHUB_ENV
          fi

          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "ECR_REPO=${{ secrets.ECR_REPO }}" >> $GITHUB_ENV

      - name: Validate required env
        run: |
          missing=0
          for v in AWS_REGION AWS_ACCOUNT_ID ECR_REPO ECS_CLUSTER ECS_SERVICE TASK_DEF; do
            if [ -z "${!v}" ]; then
              echo "::error title=Missing variable::$v is empty. Check your repository Secrets for the correct value."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password \
          | docker login \
          --username AWS \
          --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Set Version
        run: |
          VERSION=${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Frontend
        run: docker build -f frontend/Dockerfile -t frontend:$VERSION .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Frontend
        run: trivy image --scanners vuln --ignore-unfixed --exit-code 1 --severity CRITICAL frontend:$VERSION

      - name: Tag Image
        run: |
          IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO

          docker tag frontend:$VERSION $IMAGE_URI:frontend-$VERSION

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      - name: Push Image
        run: |
          docker push $IMAGE_URI:frontend-$VERSION

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch Task Definition
        run: |
          aws ecs describe-task-definition \
          --task-definition $TASK_DEF \
          --query taskDefinition > task.json

      - name: Update Task Definition
        run: |
          jq --arg FRONT "$IMAGE_URI:frontend-$VERSION" '
            .containerDefinitions |= map(
              if .name == "frontend" then .image = $FRONT else . end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task.json > new-task.json

      - name: Register Task
        run: |
          aws ecs register-task-definition \
          --cli-input-json file://new-task.json

      - name: Deploy to ECS
        if: env.ENV != 'dev'
        run: |
          aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --force-new-deployment
