name: "CodeQL Analysis"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '24 1 * * 5'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        queries: security-extended,security-and-quality

    # Autobuild attempts to build any compiled languages  (C/C++, C#, Go, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun

    #   If the Autobuild fails above, remove it and uncomment the following three lines.
    #   modify them (or add more) to build your code if your project, please refer to the EXAMPLE below for guidance.

    # - run: |
    #     echo "Run, Build Application using script"
    #     ./location_of_script_within_repo/buildscript.sh

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"

    # Custom step to fail the build if vulnerabilities are found
    - name: Fail on Vulnerabilities
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🔍 Checking for open CodeQL alerts..."
        # Wait a few seconds for results to be processed by GitHub
        sleep 10
        ALERTS=$(gh api -H "Accept: application/vnd.github+json" \
          /repos/${{ github.repository }}/code-scanning/alerts?state=open)
        
        COUNT=$(echo "$ALERTS" | jq '[.[] | select(.rule.security_severity_level != "note")] | length')
        
        if [ "$COUNT" -gt 0 ]; then
          echo "❌ FAILED: Found $COUNT security vulnerabilities!"
          echo "$ALERTS" | jq -r '.[] | "🔸 [\(.rule.security_severity_level)] \(.rule.description)\n   File: \(.most_recent_instance.location.path)\n"'
          exit 1
        else
          echo "✅ No security vulnerabilities found."
        fi
