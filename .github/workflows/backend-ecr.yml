                | upsert_env("SECRET_KEY"; $SECRET_KEY)
                | (if ($FRONTEND_HOST | length) > 0 then upsert_env("FRONTEND_HOST"; $FRONTEND_HOST) else . end)
                | (if ($BACKEND_CORS_ORIGINS | length) > 0 then upsert_env("BACKEND_CORS_ORIGINS"; $BACKEND_CORS_ORIGINS) else . end)
                | (if ($AUTH_ENABLED | length) > 0 then upsert_env("AUTH_ENABLED"; $AUTH_ENABLED) else . end)
                | upsert_env("POSTGRES_SERVER"; $POSTGRES_SERVER)
                | (if ($POSTGRES_PORT | length) > 0 then upsert_env("POSTGRES_PORT"; $POSTGRES_PORT) else . end)
                | upsert_env("POSTGRES_USER"; $POSTGRES_USER)
                | upsert_env("POSTGRES_PASSWORD"; $POSTGRES_PASSWORD)
                | upsert_env("POSTGRES_DB"; $POSTGRES_DB)
