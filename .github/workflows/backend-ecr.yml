            echo "::error title=Missing environment secrets::ECS_CLUSTER/ECS_SERVICE/ECS_TASK_DEFINITION/CONTAINER_NAME and app settings (PROJECT_NAME/POSTGRES_*/SECRET_KEY/FIRST_SUPERUSER*) must be defined for 'uat' environment."
            exit 1
          fi
      - name: Fetch task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_TASK_DEFINITION }}" \
            --query taskDefinition > task.json
      - name: Update task image
        run: |
          IMAGE_URI=${{ needs.build-scan-push.outputs.image_uri }}
          VERSION=${{ needs.build-scan-push.outputs.version }}
          APP_ENVIRONMENT=staging
          jq \
            --arg IMG "$IMAGE_URI:backend-$VERSION" \
            --arg NAME "${{ secrets.CONTAINER_NAME }}" \
            --arg PROJECT_NAME "${{ secrets.PROJECT_NAME }}" \
            --arg ENVIRONMENT "$APP_ENVIRONMENT" \
            --arg SECRET_KEY "${{ secrets.SECRET_KEY }}" \
            --arg FRONTEND_HOST "${{ secrets.FRONTEND_HOST }}" \
            --arg BACKEND_CORS_ORIGINS "${{ secrets.BACKEND_CORS_ORIGINS }}" \
            --arg AUTH_ENABLED "${{ secrets.AUTH_ENABLED }}" \
            --arg POSTGRES_SERVER "${{ secrets.POSTGRES_SERVER }}" \
            --arg POSTGRES_PORT "${{ secrets.POSTGRES_PORT }}" \
            --arg POSTGRES_USER "${{ secrets.POSTGRES_USER }}" \
            --arg POSTGRES_PASSWORD "${{ secrets.POSTGRES_PASSWORD }}" \
            --arg POSTGRES_DB "${{ secrets.POSTGRES_DB }}" \
            --arg FIRST_SUPERUSER "${{ secrets.FIRST_SUPERUSER }}" \
            --arg FIRST_SUPERUSER_PASSWORD "${{ secrets.FIRST_SUPERUSER_PASSWORD }}" \
            '
            def upsert_env($k; $v):
              .environment = ((.environment // []) | map(select(.name != $k)) + [{"name": $k, "value": $v}]);

            .containerDefinitions |= map(
              if .name == $NAME then
                (.image = $IMG)
                | upsert_env("PROJECT_NAME"; $PROJECT_NAME)
                | upsert_env("ENVIRONMENT"; $ENVIRONMENT)
                | upsert_env("SECRET_KEY"; $SECRET_KEY)
                | (if ($FRONTEND_HOST | length) > 0 then upsert_env("FRONTEND_HOST"; $FRONTEND_HOST) else . end)
                | (if ($BACKEND_CORS_ORIGINS | length) > 0 then upsert_env("BACKEND_CORS_ORIGINS"; $BACKEND_CORS_ORIGINS) else . end)
                | (if ($AUTH_ENABLED | length) > 0 then upsert_env("AUTH_ENABLED"; $AUTH_ENABLED) else . end)
                | upsert_env("POSTGRES_SERVER"; $POSTGRES_SERVER)
                | (if ($POSTGRES_PORT | length) > 0 then upsert_env("POSTGRES_PORT"; $POSTGRES_PORT) else . end)
                | upsert_env("POSTGRES_USER"; $POSTGRES_USER)
                | upsert_env("POSTGRES_PASSWORD"; $POSTGRES_PASSWORD)
                | upsert_env("POSTGRES_DB"; $POSTGRES_DB)
                | upsert_env("FIRST_SUPERUSER"; $FIRST_SUPERUSER)
                | upsert_env("FIRST_SUPERUSER_PASSWORD"; $FIRST_SUPERUSER_PASSWORD)
              else .
              end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task.json > new-task.json
      - name: Register task
        run: aws ecs register-task-definition --cli-input-json file://new-task.json
      - name: Update service
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-uat
    environment: production
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Validate environment secrets
