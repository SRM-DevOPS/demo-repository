            --arg ENVIRONMENT "$APP_ENVIRONMENT" \
            --arg SECRET_KEY "${{ secrets.SECRET_KEY }}" \
            --arg FRONTEND_HOST "${{ secrets.FRONTEND_HOST }}" \
            --arg BACKEND_CORS_ORIGINS "${{ secrets.BACKEND_CORS_ORIGINS }}" \
            --arg AUTH_ENABLED "${{ secrets.AUTH_ENABLED }}" \
            --arg POSTGRES_SERVER "${{ secrets.POSTGRES_SERVER }}" \
            --arg POSTGRES_PORT "${{ secrets.POSTGRES_PORT }}" \
            --arg POSTGRES_USER "${{ secrets.POSTGRES_USER }}" \
            --arg POSTGRES_PASSWORD "${{ secrets.POSTGRES_PASSWORD }}" \
