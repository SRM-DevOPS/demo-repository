name: Build, Push to ECR & Deploy to ECS

on:
  push:
    branches:
      - main
      - feature/*

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPO: ${{ secrets.ECR_REPO }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ secrets.ECS_TASK_DEFINITION }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3️⃣ Login to ECR
      - name: Login to ECR
        run: |
          aws ecr get-login-password \
          | docker login \
          --username AWS \
          --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      # 4️⃣ Get previous image tag
      - name: Get previous image
        id: prev
        run: |
          aws ecr describe-images \
            --repository-name $ECR_REPO \
            --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' \
            --output text > previous.txt || echo "none" > previous.txt

          PREV=$(cat previous.txt)
          echo "Previous image: $PREV"
          echo "PREVIOUS=$PREV" >> $GITHUB_ENV

      # 5️⃣ Set new version
      - name: Set version
        run: |
          VERSION=${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 6️⃣ Build Docker image
      - name: Build image
        run: |
          docker build -t $ECR_REPO:$VERSION .

      # 7️⃣ Tag image
      - name: Tag image
        run: |
          IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO

          docker tag $ECR_REPO:$VERSION $IMAGE_URI:$VERSION
          docker tag $ECR_REPO:$VERSION $IMAGE_URI:latest

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # 8️⃣ Push to ECR
      - name: Push image
        run: |
          docker push $IMAGE_URI:$VERSION
          docker push $IMAGE_URI:latest

      # 9️⃣ Install jq (needed for JSON edit)
      - name: Install jq
        run: sudo apt-get install -y jq

      # 🔟 Get current task definition
      - name: Fetch task definition
        run: |
          aws ecs describe-task-definition \
          --task-definition $ECS_TASK_DEFINITION \
          --query taskDefinition > task-def.json

      # 1️⃣1️⃣ Update image in task definition
      - name: Update task definition
        run: |
          jq --arg IMAGE "$IMAGE_URI:$VERSION" \
          --arg NAME "$CONTAINER_NAME" \
          '.containerDefinitions |= map(
            if .name == $NAME then .image = $IMAGE else . end
          )' task-def.json > new-task-def.json

      # 1️⃣2️⃣ Register new task definition
      - name: Register task definition
        run: |
          aws ecs register-task-definition \
          --cli-input-json file://new-task-def.json

      # 1️⃣3️⃣ Deploy to ECS
      - name: Deploy to ECS
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --force-new-deployment