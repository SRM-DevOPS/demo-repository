          if [ -z "${{ secrets.ECS_CLUSTER }}" ] || [ -z "${{ secrets.ECS_SERVICE }}" ] || [ -z "${{ secrets.ECS_TASK_DEFINITION }}" ] || [ -z "${{ secrets.CONTAINER_NAME }}" ] || [ -z "${{ secrets.PROJECT_NAME }}" ] || [ -z "${{ secrets.POSTGRES_SERVER }}" ] || [ -z "${{ secrets.POSTGRES_USER }}" ] || [ -z "${{ secrets.POSTGRES_PASSWORD }}" ] || [ -z "${{ secrets.POSTGRES_DB }}" ] || [ -z "${{ secrets.SECRET_KEY }}" ] || [ -z "${{ secrets.FIRST_SUPERUSER }}" ] || [ -z "${{ secrets.FIRST_SUPERUSER_PASSWORD }}" ]; then
            echo "::error title=Missing environment secrets::ECS_CLUSTER/ECS_SERVICE/ECS_TASK_DEFINITION/CONTAINER_NAME and app settings (PROJECT_NAME/POSTGRES_*/SECRET_KEY/FIRST_SUPERUSER*) must be defined for 'production' environment."
            exit 1
          fi
      - name: Fetch task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.ECS_TASK_DEFINITION }}" \
