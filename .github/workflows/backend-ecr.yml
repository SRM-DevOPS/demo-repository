name: Backend CI → ECR → ECS (Integration → Staging → Prod)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ecr.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ecr.yml'

jobs:
  code-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Trivy FS scan
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        run: |
          trivy fs --scanners vuln,secret,config --ignore-unfixed --severity CRITICAL --exit-code 1 --skip-dirs .git,.venv,frontend/node_modules .

  build-scan-push:
    runs-on: ubuntu-latest
    needs: code-scan
    env:
      ECR_REPO_NAME: ${{ secrets.BACKEND_ECR_REPO || secrets.ECR_REPO }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_uri: ${{ steps.meta.outputs.image_uri }}
      repo_name: ${{ steps.meta.outputs.repo_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      - name: Set Image URI and version
        id: meta
        run: |
          if [ -z "${{ env.ECR_REPO_NAME }}" ]; then
            echo "::error::Neither BACKEND_ECR_REPO nor ECR_REPO secrets are set."
            exit 1
          fi
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO_NAME }}"
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "repo_name=${{ env.ECR_REPO_NAME }}" >> $GITHUB_OUTPUT
          VERSION=${GITHUB_SHA::7}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Build image
        run: docker build -f backend/Dockerfile -t backend:${{ steps.meta.outputs.version }} .
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Trivy Image scan
        run: trivy image --scanners vuln --ignore-unfixed --severity CRITICAL --exit-code 1 backend:${{ steps.meta.outputs.version }}
      - name: Tag and push
        run: |
          IMAGE_URI=${{ steps.meta.outputs.image_uri }}
          VERSION=${{ steps.meta.outputs.version }}
          docker tag backend:$VERSION $IMAGE_URI:backend-$VERSION
          docker push $IMAGE_URI:backend-$VERSION

  deploy-integration:
    runs-on: ubuntu-latest
    needs: build-scan-push
    environment: integration
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Validate environment secrets
        run: |
          MISSING=()
          [ -z "${{ secrets.ECS_CLUSTER }}" ] && MISSING+=("ECS_CLUSTER")
          [ -z "${{ secrets.BACKEND_ECS_SERVICE }}" ] && MISSING+=("BACKEND_ECS_SERVICE")
          [ -z "${{ secrets.BACKEND_ECS_TASK_DEFINITION }}" ] && MISSING+=("BACKEND_ECS_TASK_DEFINITION")
          [ -z "${{ secrets.BACKEND_CONTAINER_NAME }}" ] && MISSING+=("BACKEND_CONTAINER_NAME")
          [ -z "${{ secrets.PROJECT_NAME }}" ] && MISSING+=("PROJECT_NAME")
          [ -z "${{ secrets.POSTGRES_SERVER }}" ] && MISSING+=("POSTGRES_SERVER")
          [ -z "${{ secrets.POSTGRES_USER }}" ] && MISSING+=("POSTGRES_USER")
          [ -z "${{ secrets.POSTGRES_PASSWORD }}" ] && MISSING+=("POSTGRES_PASSWORD")
          [ -z "${{ secrets.POSTGRES_DB }}" ] && MISSING+=("POSTGRES_DB")
          [ -z "${{ secrets.SECRET_KEY }}" ] && MISSING+=("SECRET_KEY")
          [ -z "${{ secrets.FIRST_SUPERUSER }}" ] && MISSING+=("FIRST_SUPERUSER")
          [ -z "${{ secrets.FIRST_SUPERUSER_PASSWORD }}" ] && MISSING+=("FIRST_SUPERUSER_PASSWORD")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "::error title=Missing environment secrets::Missing in 'integration' environment: ${MISSING[*]}"
            exit 1
          fi
      - name: Verify task definition exists
        run: |
          set +e
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.BACKEND_ECS_TASK_DEFINITION }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "::error title=Invalid BACKEND_ECS_TASK_DEFINITION::Cannot describe task definition '${{ secrets.BACKEND_ECS_TASK_DEFINITION }}'. Ensure it is a task definition family name or full ARN in the same AWS account/region, and that the IAM user has ecs:DescribeTaskDefinition."
            echo "Recent task definitions in this region/account:"
            aws ecs list-task-definitions --sort DESC --max-items 20 --output text || true
            exit 1
          fi
      - name: Fetch task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ secrets.BACKEND_ECS_TASK_DEFINITION }}" \
            --query taskDefinition > task.json
      - name: Update task image
        run: |
          IMAGE_URI="891377374196.dkr.ecr.ap-south-1.amazonaws.com/srm-backend"
          VERSION=${{ needs.build-scan-push.outputs.version }}
          APP_ENVIRONMENT=integration
          jq \
            --arg IMG "$IMAGE_URI:backend-$VERSION" \
            --arg NAME "${{ secrets.BACKEND_CONTAINER_NAME }}" \
            --arg PROJECT_NAME "${{ secrets.PROJECT_NAME }}" \
            --arg ENVIRONMENT "$APP_ENVIRONMENT" \
            --arg SECRET_KEY "${{ secrets.SECRET_KEY }}" \
            --arg FRONTEND_HOST "${{ secrets.FRONTEND_HOST }}" \
            --arg BACKEND_CORS_ORIGINS "${{ secrets.BACKEND_CORS_ORIGINS }}" \
            --arg AUTH_ENABLED "${{ secrets.AUTH_ENABLED }}" \
            --arg POSTGRES_SERVER "${{ secrets.POSTGRES_SERVER }}" \
            --arg POSTGRES_PORT "${{ secrets.POSTGRES_PORT }}" \
            --arg POSTGRES_USER "${{ secrets.POSTGRES_USER }}" \
            --arg POSTGRES_PASSWORD "${{ secrets.POSTGRES_PASSWORD }}" \
            --arg POSTGRES_DB "${{ secrets.POSTGRES_DB }}" \
            --arg FIRST_SUPERUSER "${{ secrets.FIRST_SUPERUSER }}" \
            --arg FIRST_SUPERUSER_PASSWORD "${{ secrets.FIRST_SUPERUSER_PASSWORD }}" \
            '
            def upsert_env($k; $v):
              .environment = ((.environment // []) | map(select(.name != $k)) + [{"name": $k, "value": $v}]);

            .containerDefinitions |= map(
              if .name == $NAME then
                (.image = $IMG)
                | upsert_env("PROJECT_NAME"; $PROJECT_NAME)
                | upsert_env("ENVIRONMENT"; $ENVIRONMENT)
                | upsert_env("SECRET_KEY"; $SECRET_KEY)
                | (if ($FRONTEND_HOST | length) > 0 then upsert_env("FRONTEND_HOST"; $FRONTEND_HOST) else . end)
                | (if ($BACKEND_CORS_ORIGINS | length) > 0 then upsert_env("BACKEND_CORS_ORIGINS"; $BACKEND_CORS_ORIGINS) else . end)
                | (if ($AUTH_ENABLED | length) > 0 then upsert_env("AUTH_ENABLED"; $AUTH_ENABLED) else . end)
                | upsert_env("POSTGRES_SERVER"; $POSTGRES_SERVER)
                | (if ($POSTGRES_PORT | length) > 0 then upsert_env("POSTGRES_PORT"; $POSTGRES_PORT) else . end)
                | upsert_env("POSTGRES_USER"; $POSTGRES_USER)
                | upsert_env("POSTGRES_PASSWORD"; $POSTGRES_PASSWORD)
                | upsert_env("POSTGRES_DB"; $POSTGRES_DB)
                | upsert_env("FIRST_SUPERUSER"; $FIRST_SUPERUSER)
                | upsert_env("FIRST_SUPERUSER_PASSWORD"; $FIRST_SUPERUSER_PASSWORD)
              else .
              end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task.json > new-task.json
      - name: Register task
        id: register-task
        run: |
          NEW_TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task.json --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_definition_arn=$NEW_TASK_ARN" >> $GITHUB_OUTPUT
      - name: Update service
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.BACKEND_ECS_SERVICE }}" \
            --task-definition "${{ steps.register-task.outputs.task_definition_arn }}" \
            --force-new-deployment

