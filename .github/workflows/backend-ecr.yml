name: Backend - Build, Scan, Push & Deploy (Single ECR Repo)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ecr.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Set Environment based on branch
      - name: Set Environment
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/uat" ]]; then
            echo "ENV=uat" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == "refs/heads/integration" ]]; then
            echo "ENV=int" >> $GITHUB_ENV
          else
            echo "ENV=dev" >> $GITHUB_ENV
          fi

      # 3️⃣ Set dynamic variables per env
      - name: Load Env Config
        run: |
          if [[ "$ENV" == "prod" ]]; then
            echo "ECS_CLUSTER=${{ secrets.ECS_CLUSTER_PROD }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.ECS_SERVICE_BACKEND_PROD }}" >> $GITHUB_ENV
            echo "TASK_DEF=${{ secrets.ECS_TASK_DEF_BACKEND_PROD }}" >> $GITHUB_ENV
          elif [[ "$ENV" == "uat" ]]; then
            echo "ECS_CLUSTER=${{ secrets.ECS_CLUSTER_UAT }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.ECS_SERVICE_BACKEND_UAT }}" >> $GITHUB_ENV
            echo "TASK_DEF=${{ secrets.ECS_TASK_DEF_BACKEND_UAT }}" >> $GITHUB_ENV
          elif [[ "$ENV" == "int" ]]; then
            echo "ECS_CLUSTER=${{ secrets.ECS_CLUSTER_INT }}" >> $GITHUB_ENV
            echo "ECS_SERVICE=${{ secrets.ECS_SERVICE_BACKEND_INT }}" >> $GITHUB_ENV
            echo "TASK_DEF=${{ secrets.ECS_TASK_DEF_BACKEND_INT }}" >> $GITHUB_ENV
          fi

          echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "ECR_REPO=${{ secrets.ECR_REPO }}" >> $GITHUB_ENV

      # 4️⃣ Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 5️⃣ Login to ECR
      - name: Login to ECR
        run: |
          aws ecr get-login-password \
          | docker login \
          --username AWS \
          --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      # 6️⃣ Version
      - name: Set Version
        run: |
          VERSION=${GITHUB_SHA::7}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # 7️⃣ Build Images
      - name: Build Backend
        run: docker build -t backend:$VERSION ./backend

      # 8️⃣ Install Trivy
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      # 9️⃣ Scan Images (STRICT)
      - name: Scan Backend
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL backend:$VERSION

      # 🔟 Tag Images
      - name: Tag Images
        run: |
          IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO

          docker tag backend:$VERSION $IMAGE_URI:backend-$VERSION
          docker tag backend:$VERSION $IMAGE_URI:backend-$ENV-latest

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

      # 1️⃣1️⃣ Push (ONLY if scan passed)
      - name: Push Images
        run: |
          docker push $IMAGE_URI:backend-$VERSION
          docker push $IMAGE_URI:backend-$ENV-latest

      # 1️⃣2️⃣ Install jq
      - name: Install jq
        run: sudo apt-get install -y jq

      # 1️⃣3️⃣ Fetch Task Definition
      - name: Fetch Task Definition
        run: |
          aws ecs describe-task-definition \
          --task-definition $TASK_DEF \
          --query taskDefinition > task.json

      # 1️⃣4️⃣ Update images in task
      - name: Update Task Definition
        run: |
          jq --arg BACK "$IMAGE_URI:backend-$VERSION" \
             '
             .containerDefinitions |= map(
               if .name == "backend" then .image = $BACK else . end
             )
             ' task.json > new-task.json

      # 1️⃣5️⃣ Register new revision
      - name: Register Task
        run: |
          aws ecs register-task-definition \
          --cli-input-json file://new-task.json

      # 1️⃣6️⃣ Deploy (skip for feature branches)
      - name: Deploy to ECS
        if: env.ENV != 'dev'
        run: |
          aws ecs update-service \
          --cluster $ECS_CLUSTER \
          --service $ECS_SERVICE \
          --force-new-deployment
